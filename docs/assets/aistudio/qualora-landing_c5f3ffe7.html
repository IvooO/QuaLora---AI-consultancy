<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#F4F6F2;--card:#fff;--ink:#10261C;--mute:#4A5F55;--acc:#1F7A5C;--accT:#1B5E45;--soft:#DDE9E1;--dark:#10261C;--darkT:#F4F6F2;--dcard:#1A3A2D;--line:#D9E2DB;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1913;--card:#16251D;--ink:#EAF1EC;--mute:#9DB3A7;--acc:#4DBB93;--accT:#8FD1B3;--soft:#1F3A2E;--dark:#0A120E;--darkT:#EAF1EC;--dcard:#16251D;--line:#2B4237}}
:root[data-theme="dark"]{--bg:#0E1913;--card:#16251D;--ink:#EAF1EC;--mute:#9DB3A7;--acc:#4DBB93;--accT:#8FD1B3;--soft:#1F3A2E;--dark:#0A120E;--darkT:#EAF1EC;--dcard:#16251D;--line:#2B4237}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'DM Sans',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.c{max-width:1120px;margin:0 auto;padding:0 24px}
.d{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.08;margin:0;font-weight:700}
.eb{margin:0 0 10px;font-weight:700;font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--accT)}
.btn{display:inline-block;padding:15px 26px;border-radius:999px;font-weight:700;border:2px solid transparent;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.g{background:var(--acc);color:#10261C}.o{border-color:var(--ink);background:transparent;color:var(--ink)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border-radius:20px;padding:26px}
.card h3,.dk h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:24px;line-height:1.15;margin:0 0 8px}
.card p,.dk p{margin:0}
.dk{background:var(--dcard);color:var(--darkT);border-radius:20px;padding:30px}
.sec{padding:80px 0}
h2.d{font-size:clamp(30px,5vw,42px);margin-bottom:32px;max-width:780px}
nav{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;font-weight:500}
.lang{display:flex;gap:4px}
.lang button{font:inherit;font-size:14px;font-weight:700;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.q{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.q .a{display:flex;gap:8px}
.q button{font:inherit;font-weight:700;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 18px;min-height:40px;cursor:pointer}
.q button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#10261C}
.btn:focus-visible,.q button:focus-visible,.lang button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="c" style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-top:20px;padding-bottom:20px">
<a href="#top" class="d" style="font-size:26px">Qualora.</a>
<nav><a href="#services" data-k="n1"></a><a href="#contact" data-k="n2"></a>
<div class="lang" role="group" aria-label="Language"><button data-l="nl">NL</button><button data-l="fr">FR</button><button data-l="en">EN</button></div></nav>
</div>
<header id="top" class="c" style="padding-top:64px;padding-bottom:96px">
<p class="eb" data-k="he"></p>
<h1 class="d" style="font-size:clamp(38px,7vw,68px);margin-bottom:22px;max-width:920px" data-k="h1"></h1>
<p style="font-size:20px;max-width:620px;margin:0 0 32px" data-k="hs"></p>
<div style="display:flex;flex-wrap:wrap;gap:14px"><a href="#contact" class="btn g" data-k="b1"></a><a href="https://claude.ai/artifact/NFSP5aUWhvMVigJSm6de8G" class="btn o" data-k="b2"></a></div>
</header>
<section id="services" style="background:var(--card)"><div class="c sec">
<p class="eb" data-k="e1"></p><h2 class="d" data-k="t1"></h2>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
<div class="dk"><h3 data-k="c1t"></h3><p data-k="c1d"></p></div>
<div class="dk"><h3 data-k="c2t"></h3><p data-k="c2d"></p></div>
</div>
<p style="margin:28px 0 0;font-weight:700" data-k="fa"></p>
</div></section>
<section id="contact" style="background:var(--acc);color:#10261C"><div class="c" style="padding-top:72px;padding-bottom:72px">
<h2 class="d" style="font-size:clamp(30px,5vw,44px);margin-bottom:14px;max-width:760px" data-k="ct"></h2>
<p style="max-width:620px;margin:0 0 24px" data-k="cd"></p>
<p style="margin:0;font-weight:700;font-size:20px">[EMAIL] · [PHONE / BOOKING LINK]</p>
</div></section>
<footer class="c" style="padding-top:28px;padding-bottom:36px;font-size:14px;color:var(--mute);display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between">
<span>Qualora [LEGAL ENTITY] · [VAT / BCE]</span><span data-k="ft"></span>
</footer>
<script>
var T={
en:{n1:"What we do",n2:"Contact",he:"AI consultancy · Workflow automation",h1:"AI consultancy and workflow automation for food companies.",hs:"We help food companies find where AI saves time, then put it to work.",b1:"Request a discovery call",b2:"Take the AI readiness test →",e1:"What we do",t1:"From first question to working solution.",c1t:"AI consultancy",c1d:"A clear view of where AI pays off in your business, a practical roadmap and training for your team.",c2t:"Workflow automation",c2d:"Automation built around the way your team already works, with your people in control.",fa:"Every project starts with a free audit.",ct:"Request a discovery call.",cd:"Tell us about your company. The call includes a free audit of where AI can help.",ft:"Working name, to be confirmed."},
nl:{n1:"Wat we doen",n2:"Contact",he:"AI-advies · Workflowautomatisering",h1:"AI-advies en workflowautomatisering voor voedingsbedrijven.",hs:"We helpen voedingsbedrijven ontdekken waar AI tijd bespaart en zetten het daarna aan het werk.",b1:"Vraag een kennismakingsgesprek aan",b2:"Doe de AI-readiness test →",e1:"Wat we doen",t1:"Van eerste vraag tot werkende oplossing.",c1t:"AI-advies",c1d:"Een helder beeld van waar AI loont in uw bedrijf, een praktische roadmap en training voor uw team.",c2t:"Workflowautomatisering",c2d:"Automatisering rond de manier waarop uw team al werkt, met uw mensen aan het stuur.",fa:"Elk project begint met een gratis audit.",ct:"Vraag een kennismakingsgesprek aan.",cd:"Vertel ons over uw bedrijf. Het gesprek bevat een gratis audit van waar AI kan helpen.",ft:"Werknaam, nog te bevestigen."},
fr:{n1:"Ce que nous faisons",n2:"Contact",he:"Conseil en IA · Automatisation des workflows",h1:"Conseil en IA et automatisation des workflows pour les entreprises alimentaires.",hs:"Nous aidons les entreprises alimentaires à trouver où l’IA fait gagner du temps, puis à la mettre au travail.",b1:"Demander un appel de découverte",b2:"Faire le test de maturité IA →",e1:"Ce que nous faisons",t1:"De la première question à la solution qui fonctionne.",c1t:"Conseil en IA",c1d:"Une vision claire de là où l’IA est rentable dans votre entreprise, une feuille de route pratique et une formation pour votre équipe.",c2t:"Automatisation des workflows",c2d:"Une automatisation construite autour de la façon dont votre équipe travaille déjà, avec vos équipes aux commandes.",fa:"Chaque projet commence par un audit gratuit.",ct:"Demander un appel de découverte.",cd:"Parlez-nous de votre entreprise. L’appel comprend un audit gratuit des endroits où l’IA peut aider.",ft:"Nom de travail, à confirmer."}
};
var lang="en";
try{var s=localStorage.getItem("ql");if(s&&T[s])lang=s;else{var n=(navigator.language||"en").slice(0,2);if(T[n])lang=n}}catch(e){var n2=(navigator.language||"en").slice(0,2);if(T[n2])lang=n2}
function render(){var t=T[lang];document.documentElement.lang=lang;
document.querySelectorAll("[data-k]").forEach(function(e){e.textContent=t[e.getAttribute("data-k")]});
document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-l")===lang))})}
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){lang=b.getAttribute("data-l");try{localStorage.setItem("ql",lang)}catch(e){}render()}});
render();
</script>
</body>
</html>
